apiVersion: apps/v1
kind: Deployment
metadata:
  name: work-beat
  namespace: dify
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: work-beat
  template:
    metadata:
      labels:
        app: work-beat
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      containers:
        - name: work-beat
          image: langgenius/dify-api:1.7.2
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  python3 -c "import pathlib,sys; c=pathlib.Path('/proc/1/cmdline').read_bytes().replace(b'\x00',b' ');
                  sys.exit(0 if (b'celery' in c and b'beat' in c) else 1)" ||
                  python -c "import pathlib,sys; c=pathlib.Path('/proc/1/cmdline').read_bytes().replace(b'\x00',b' ');
                  sys.exit(0 if (b'celery' in c and b'beat' in c) else 1)"
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  python3 -c "import pathlib,sys; c=pathlib.Path('/proc/1/cmdline').read_bytes().replace(b'\x00',b' ');
                  sys.exit(0 if (b'celery' in c and b'beat' in c) else 1)" ||
                  python -c "import pathlib,sys; c=pathlib.Path('/proc/1/cmdline').read_bytes().replace(b'\x00',b' ');
                  sys.exit(0 if (b'celery' in c and b'beat' in c) else 1)"
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  python3 -c "import socket,sys; socket.create_connection(('redis',6379),2).close(); sys.exit(0)" ||
                  python -c "import socket,sys; socket.create_connection(('redis',6379),2).close(); sys.exit(0)"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dify-config
          env:
            - name: MODE
              value: "beat"
          volumeMounts:
            - mountPath: /app/api/storage
              name: api-storage
      volumes:
        - name: api-storage
          persistentVolumeClaim:
            claimName: api-pvc
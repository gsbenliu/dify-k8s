apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
  namespace: dify
  labels:
    app: worker
    app.kubernetes.io/instance: worker
spec:
  serviceName: worker
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: worker
          image: langgenius/dify-api:1.7.2
          ports:
            - containerPort: 5001
              protocol: TCP
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  python3 -c "import pathlib,sys; c=pathlib.Path('/proc/1/cmdline').read_bytes().replace(b'\x00',b' ');
                  sys.exit(0 if (b'celery' in c and b'worker' in c) else 1)" ||
                  python -c "import pathlib,sys; c=pathlib.Path('/proc/1/cmdline').read_bytes().replace(b'\x00',b' ');
                  sys.exit(0 if (b'celery' in c and b'worker' in c) else 1)"
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  python3 -c "import pathlib,sys; c=pathlib.Path('/proc/1/cmdline').read_bytes().replace(b'\x00',b' ');
                  sys.exit(0 if (b'celery' in c and b'worker' in c) else 1)" ||
                  python -c "import pathlib,sys; c=pathlib.Path('/proc/1/cmdline').read_bytes().replace(b'\x00',b' ');
                  sys.exit(0 if (b'celery' in c and b'worker' in c) else 1)"
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  python3 -c "import socket,sys; socket.create_connection(('redis',6379),2).close(); sys.exit(0)" ||
                  python -c "import socket,sys; socket.create_connection(('redis',6379),2).close(); sys.exit(0)"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: dify-config
          env:
            - name: MODE
              value: "worker"
            - name: SENTRY_DSN
              valueFrom:
                configMapKeyRef:
                  name: dify-config
                  key: API_SENTRY_DSN
            - name: SENTRY_TRACES_SAMPLE_RATE
              valueFrom:
                configMapKeyRef:
                  name: dify-config
                  key: API_SENTRY_TRACES_SAMPLE_RATE
            - name: SENTRY_PROFILES_SAMPLE_RATE
              valueFrom:
                configMapKeyRef:
                  name: dify-config
                  key: API_SENTRY_PROFILES_SAMPLE_RATE
            - name: INNER_API_KEY_FOR_PLUGIN
              valueFrom:
                configMapKeyRef:
                  name: dify-config
                  key: PLUGIN_DIFY_INNER_API_KEY

          volumeMounts:
            - mountPath: /app/api/storage
              name: worker-storage
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      volumes:
        - name: worker-storage
          persistentVolumeClaim:
            claimName: api-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: dify
spec:
  ports:
  - protocol: TCP
    port: 5001
    targetPort: 5001
  selector:
    app: worker
  type: ClusterIP
